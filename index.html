<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPRI — Financial Manager</title>
    <meta name="description" content="EPRI is an automated financial manager and advisor for small businesses: monthly profit reports, overspending warnings, charts, budgets, suppliers, complaints and pricing — encrypted with AES-256." />
    <meta name="theme-color" content="#2a78d6" />
    <script src="theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
      <style>
      html[data-theme="dark"] body { background: #06060a; color: #f4f4f7; }
      html[data-theme="light"] body { background: #f5f5f8; color: #0c0c16; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 500 14px/1.4 Inter, system-ui, sans-serif; opacity: .75; animation: boot-in .4s ease .15s both; }
      .boot svg { animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(.9); opacity: .6; } }
      @keyframes boot-in { from { opacity: 0; } }
    </style>
  </head>
  <body class="grain app-body">
    <div id="root">
      <!-- Shown until the app has downloaded; React replaces it. -->
      <div class="boot">
        <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#7c5cff"/><rect x="7" y="17" width="4" height="8" rx="1.5" fill="#fff" opacity=".7"/><rect x="14" y="12" width="4" height="13" rx="1.5" fill="#fff" opacity=".85"/><rect x="21" y="7" width="4" height="18" rx="1.5" fill="#fff"/></svg>
        <p>Loading EPRI…</p>
        <noscript><p>EPRI needs JavaScript turned on.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
