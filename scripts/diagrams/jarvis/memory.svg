<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0b2a3f"/><stop offset="1" stop-color="#03070d"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#67e8f9" stroke-opacity="0.05"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="80" y="104" font-family="Inter" font-weight="600" font-size="44" fill="#e8f6ff">Memory that keeps up with you</text>
  <text x="80" y="148" font-family="Inter" font-size="22" fill="#8aa4b8">After every reply a background pass decides what is worth remembering, and recall mixes meaning with keywords.</text>
  <g>
    <rect x="80" y="240" width="400" height="230" rx="20" fill="#0a1824" fill-opacity="0.85" stroke="#67e8f9" stroke-opacity="0.45"/>
    <rect x="81" y="241" width="398" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="104" y="274" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#67e8f9">AFTER EACH REPLY</text>
    <text x="104" y="302" font-family="Inter" font-weight="600" font-size="26" fill="#e8f6ff">Memory pass</text>
    <text x="104" y="332" font-family="Inter" font-size="20" fill="#8aa4b8">adds new facts</text><text x="104" y="362" font-family="Inter" font-size="20" fill="#8aa4b8">updates changed ones</text><text x="104" y="392" font-family="Inter" font-size="20" fill="#8aa4b8">deletes wrong ones</text>
  </g>
<g>
    <rect x="600" y="240" width="400" height="230" rx="20" fill="#0a1824" fill-opacity="0.85" stroke="#7c8cff" stroke-opacity="0.45"/>
    <rect x="601" y="241" width="398" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="624" y="274" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#7c8cff">STORED</text>
    <text x="624" y="302" font-family="Inter" font-weight="600" font-size="26" fill="#e8f6ff">Long term facts</text>
    <text x="624" y="332" font-family="Inter" font-size="20" fill="#8aa4b8">importance + last used</text><text x="624" y="362" font-family="Inter" font-size="20" fill="#8aa4b8">unconfirmed ones flagged</text><text x="624" y="392" font-family="Inter" font-size="20" fill="#8aa4b8">editable on Memory page</text>
  </g>
<g>
    <rect x="1120" y="240" width="400" height="230" rx="20" fill="#0a1824" fill-opacity="0.85" stroke="#a78bfa" stroke-opacity="0.45"/>
    <rect x="1121" y="241" width="398" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="1144" y="274" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#a78bfa">WHEN YOU ASK</text>
    <text x="1144" y="302" font-family="Inter" font-weight="600" font-size="26" fill="#e8f6ff">Recall</text>
    <text x="1144" y="332" font-family="Inter" font-size="20" fill="#8aa4b8">meaning (NIM embeddings)</text><text x="1144" y="362" font-family="Inter" font-size="20" fill="#8aa4b8">+ keywords</text><text x="1144" y="392" font-family="Inter" font-size="20" fill="#8aa4b8">+ importance + recency</text>
  </g>
<g>
    <rect x="600" y="580" width="400" height="200" rx="20" fill="#0a1824" fill-opacity="0.85" stroke="#67e8f9" stroke-opacity="0.45"/>
    <rect x="601" y="581" width="398" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <text x="624" y="614" font-family="JetBrains Mono" font-size="14" letter-spacing="2" fill="#67e8f9">RESULT</text>
    <text x="624" y="642" font-family="Inter" font-weight="600" font-size="26" fill="#e8f6ff">Answers that fit you</text>
    <text x="624" y="672" font-family="Inter" font-size="20" fill="#8aa4b8">checks old details</text><text x="624" y="702" font-family="Inter" font-size="20" fill="#8aa4b8">instead of assuming</text>
  </g>
<g>
    <line x1="480" y1="355" x2="596" y2="355" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="2.5"  marker-end="url(#arrow)" />
    
  </g>
<g>
    <line x1="1000" y1="355" x2="1116" y2="355" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="2.5"  marker-end="url(#arrow)" />
    
  </g>
<g>
    <line x1="1320" y1="470" x2="1004" y2="650" stroke="#67e8f9" stroke-opacity="0.8" stroke-width="2.5"  marker-end="url(#arrow)" />
    
  </g>
</svg>